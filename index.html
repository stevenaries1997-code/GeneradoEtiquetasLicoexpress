<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Etiquetas - LICOEXPRESS</title>
    <style>
        html { zoom: 0.90; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body { background: #f1f3f5; padding: 15px; color: #111; }
        .app { max-width: 1400px; margin: auto; }

        /* HEADER & FIRMA */
        .header {
            background: white; border-radius: 18px; padding: 18px;
            margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border: 1px solid #e2e2e2;
            display: flex; align-items: center; justify-content: space-between;
        }
        .titulo { font-size: 28px; font-weight: 900; }
        .subtitulo { color: #666; margin-top: 4px; font-size: 13px; }
        .firma { font-size: 24px; color: #111; font-family: cursive; font-style: italic; font-weight: bold; }

        /* REJILLA DE CONFIGURACIÓN */
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white; padding: 20px; border-radius: 18px;
            border: 1px solid #e2e2e2; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .card-title {
            font-weight: 900; font-size: 14px; margin-bottom: 15px; color: #333;
            text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #f1f3f5; padding-bottom: 8px;
        }

        .input-group { margin-bottom: 12px; position: relative; }
        .input-group label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 5px; color: #555; text-transform: uppercase; }
        .input-group input {
            width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 12px;
            font-size: 14px; font-weight: 600; transition: 0.2s;
        }
        .input-group input:focus { outline: none; border-color: #111; }

        /* AUTOCOMPLETADO */
        .lista-productos {
            position: absolute; top: 100%; left: 0; width: 100%; background: white;
            border: 1px solid #ddd; border-radius: 12px; max-height: 250px;
            overflow-y: auto; z-index: 999; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .item-producto { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 13px; }
        .item-producto:hover { background: #f5f5f5; }

        /* BOTONES */
        .botones { display: flex; gap: 12px; margin-top: 10px; }
        button {
            flex: 1; padding: 14px; border-radius: 12px; font-weight: bold;
            cursor: pointer; transition: 0.2s; border: none; font-size: 14px;
        }
        .btn-generar { background: black; color: white; }
        .btn-imprimir { background: white; border: 2px solid black; color: black; }
        button:hover { opacity: 0.8; transform: translateY(-1px); }

        /* PREVIEW */
        .preview-area { background: white; border-radius: 24px; padding: 25px; border: 1px solid #e2e2e2; }
        #contenedorEtiquetas { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

        /* DISEÑO ETIQUETA */
        .etiqueta {
            background: white; border: 3px solid #000; border-radius: 18px; position: relative;
            overflow: hidden; display: flex; flex-direction: column; padding: 15px; color: black;
        }
        .barra-superior { width: 100%; height: 12px; background: black; position: absolute; top: 0; left: 0; }
        .logo { width: 45px; position: absolute; top: 18px; right: 18px; }
        .codigo { font-size: 14px; font-weight: bold; color: #444; }
        .producto { font-weight: 900; width: 80%; margin-top: 15px; line-height: 1.1; text-transform: uppercase; }
        .precio { font-weight: 900; position: absolute; left: 18px; bottom: 18px; }

        @media print {
            .header, .config-grid, .btn-print, .botones { display: none !important; }
            body { background: white; padding: 0; }
            .preview-area { border: none; padding: 0; }
        }
    </style>
</head>

    </div>

    <div class="preview-area">
        <div id="contenedorEtiquetas"></div>
    </div>
</div>

    const inputNombre = document.getElementById('nombre');
    const lista = document.getElementById('listaProductos');

    inputNombre.addEventListener('input', () => {
        const val = inputNombre.value.toUpperCase();
        lista.innerHTML = '';
        if (!val) return;

        productos.filter(p => p.nombre.includes(val)).forEach(p => {
            const div = document.createElement('div');
            div.className = 'item-producto';
            div.innerHTML = p.nombre;
            div.onclick = () => {
                inputNombre.value = p.nombre;
                document.getElementById('precio').value = p.precio;
                document.getElementById('codigo').value = p.codigo;
                lista.innerHTML = '';
                generarEtiquetas();
            };
            lista.appendChild(div);
        });
    });

    function generarEtiquetas() {
        const contenedor = document.getElementById("contenedorEtiquetas");
        const n = document.getElementById("nombre").value || "PRODUCTO";
        const p = document.getElementById("precio").value || "$0";
        const c = document.getElementById("codigo").value || "000";
        const cant = document.getElementById("cantidad").value;
        const w = document.getElementById("ancho").value;
        const h = document.getElementById("alto").value;
        const tProd = document.getElementById("tamanoProducto").value;
        const tPrec = document.getElementById("tamanoPrecio").value;

        contenedor.innerHTML = "";
        for(let i=0; i<cant; i++) {
            contenedor.innerHTML += `
                <div class="etiqueta" style="width:${w}cm; height:${h}cm;">
                    <div class="barra-superior"></div>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWEOpuUVI7MdP6F4bFWIGUq_VxAyKJXjrtPA&s" class="logo">
                    <div class="codigo">COD: ${c}</div>
                    <div class="producto" style="font-size:${tProd}px;">${n}</div>
                    <div class="precio" style="font-size:${tPrec}px;">${p}</div>
                </div>`;
        }
    }

    window.onload = generarEtiquetas;
